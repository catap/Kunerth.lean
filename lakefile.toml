name = "kunerth"
version = "0.1.0"
defaultTargets = [
  "Kunerth_1877_Neue_Methoden",
  "Kunerth_1878a_Rational_Method",
  "Kunerth_1878b_Modular_Congruences",
  "Kunerth_1880_Integer_Generalization"
]

[[lean_lib]]
name = "Kunerth_1877_Neue_Methoden"
globs = ["Kunerth_1877_Neue_Methoden.+"]

[[lean_lib]]
name = "Kunerth_1878a_Rational_Method"
globs = ["Kunerth_1878a_Rational_Method.+"]

[[lean_lib]]
name = "Kunerth_1878b_Modular_Congruences"
globs = ["Kunerth_1878b_Modular_Congruences.+"]

[[lean_lib]]
name = "Kunerth_1880_Integer_Generalization"
globs = ["Kunerth_1880_Integer_Generalization.+"]
